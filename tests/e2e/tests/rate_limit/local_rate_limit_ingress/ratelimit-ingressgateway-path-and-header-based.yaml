apiVersion: gateway.kyma-project.io/v1alpha1
kind: RateLimit
metadata:
  name: "{{.Name}}"
  namespace: istio-system
spec:
  selectorLabels:
    app: istio-ingressgateway
  enableResponseHeaders: true
  local:
    defaultBucket:
      maxTokens: 10
      tokensPerFill: 10
      fillInterval: 120s
    buckets:
      - path: /headers
        headers:
          X-Rate-Limited: "true"
        bucket:
          maxTokens: 1
          tokensPerFill: 1
          fillInterval: 120s
