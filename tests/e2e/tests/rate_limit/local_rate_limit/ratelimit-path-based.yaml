apiVersion: gateway.kyma-project.io/v1alpha1
kind: RateLimit
metadata:
  name: "{{.Name}}"
  namespace: "{{.Namespace}}"
spec:
  selectorLabels:
    app: httpbin
  enableResponseHeaders: true
  local:
    defaultBucket:
      maxTokens: {{.MaxTokens}}
      tokensPerFill: {{.TokensPerFill}}
      fillInterval: "{{.FillInterval}}"
    buckets:
      - path: "{{.Path}}"
        bucket:
          maxTokens: {{.PathMaxTokens}}
          tokensPerFill: {{.PathTokensPerFill}}
          fillInterval: "{{.PathFillInterval}}"
