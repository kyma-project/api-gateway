apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: "{{.Name}}"
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
        - '{{.Host}}'
      port:
        name: "{{.Name}}-https"
        number: 443
        protocol: HTTPS
      tls:
        credentialName: "{{.TLSSecretName}}"
        mode: SIMPLE

