apiVersion: dns.gardener.cloud/v1alpha1
kind: DNSProvider
metadata:
  name: "{{.Name}}"
  labels:
    owner: "custom-domain-test"
  annotations:
    dns.gardener.cloud/class: garden
spec:
  type: google-clouddns
  secretRef:
    name: "{{.SecretName}}"
  domains:
    include:
      - "{{.ParentDomain}}"

