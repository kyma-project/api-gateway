apiVersion: v1
kind: Service
metadata:
  name: httpbin-{{.TestID}}
  namespace: "{{.Namespace}}"
  labels:
    app: httpbin-{{.TestID}}
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 8080
  selector:
    app: httpbin-{{.TestID}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-{{.TestID}}
  namespace: "{{.Namespace}}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin-{{.TestID}}
      version: v1
  template:
    metadata:
      labels:
        app: httpbin-{{.TestID}}
        version: v1
    spec:
      containers:
      - image: docker.io/mccutchen/go-httpbin:v2.15.0
        imagePullPolicy: IfNotPresent
        name: httpbin
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /status/200
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
          runAsGroup: 65534
