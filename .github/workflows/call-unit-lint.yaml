# Jobs defined in this file are responsible for things that do not require container image
# but still relevant to the codebase such as unit tests, linting etc

name: Pull Request unit, integration & lint

permissions:
  contents: read
  code-quality: write

on:
  workflow_call:

jobs:
  lint:
    name: Golang lint check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
          cache: false # We need to disable caching here, since this is handled by the golangci-lint action
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a #v9.3.0
        with:
          version: 'latest'
          args: --timeout=10m --verbose

  check-manifests:
    name: Check generate and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: |
          ./hack/check-manifests-generate.sh
        shell: bash
      - name: Upload generated manifest diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-manifest-diff
          path: git-diff.diff
        if: failure()

  run-unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
      - name: Run tests
        run: make test
      - name: Convert coverage to Cobertura XML
        run: go tool gocover-cobertura < cover.out > coverage.xml
      - name: Upload coverage report
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1
        with:
          file: coverage.xml
          language: Go
          label: unit-tests
          fail-on-error: false
