name: Pull Request

permissions:
  contents: read
  code-quality: write

on:
  pull_request:
    types: [ synchronize, opened, reopened, ready_for_review ]
    branches:
      - "main"
      - 'release-**'
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.0
  IMAGE_NAME: "api-gateway-manager"

jobs:
  detect-scope:
    name: Detect scope
    runs-on: ubuntu-latest
    outputs:
      has-docs: ${{ steps.check.outputs.has-docs }}
      has-images: ${{ steps.check.outputs.has-images }}
      has-code: ${{ steps.check.outputs.has-code }}
      has-pipeline: ${{ steps.check.outputs.has-pipeline }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed="$(gh pr diff --name-only "${PR_NUMBER}" --repo "${{ github.repository }}")"

          if echo "${changed}" | grep -qE '\.(md|txt|jpg|jpeg|png|svg|drawio)$'; then
            echo "Detected documentation changes"
            echo "has-docs=true" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^external-images\.yaml$'; then
            echo "Detected image changes"
            echo "has-images=true" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(apis|cmd|config|controllers|internal|tests|performance_tests|crd-ref-docs)/|^(Dockerfile|go\.mod|go\.sum|component-config\.yaml)$'; then
            echo "Detected code changes"
            echo "has-code=true" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(hack|\.github)/|^(MINOR_VERSION|Makefile)$'; then
            echo "Detected pipeline changes"
            echo "has-pipeline=true" >> "${GITHUB_OUTPUT}"
          fi

  check-docs:
    name: Check docs
    runs-on: ubuntu-latest
    needs: [ detect-scope ]
    if: needs.detect-scope.outputs.has-docs == 'true' || needs.detect-scope.outputs.has-pipeline == 'true'
    steps:
      - run: echo "Documentation files changed; no tests required."

  check-images:
    name: Check images
    runs-on: ubuntu-latest
    needs: [ detect-scope ]
    if: needs.detect-scope.outputs.has-images == 'true' || needs.detect-scope.outputs.has-pipeline == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check images exist on Docker Hub
        run: hack/ci/check-dockerhub-images.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.27.3'

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch gitleaks ${{ env.GITLEAKS_VERSION }}
        run: curl -Lso gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz && tar -xvzf ./gitleaks.tar.gz
      - name: Run gitleaks
        # Scan commits between base and head of the pull request
        run: ./gitleaks detect --log-opts=${PULL_BASE_SHA}...${PULL_HEAD_SHA} --verbose --redact
        env:
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  build-image:
    name: Build manager image
    runs-on: ubuntu-latest
    needs: [ detect-scope ]
    if: needs.detect-scope.outputs.has-code == 'true' || needs.detect-scope.outputs.has-pipeline == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/build-manager-image
        with:
          operator-image-name: "api-gateway-manager:PR-${{github.event.number}}"

  get-image:
    name: Get manager image
    runs-on: ubuntu-latest
    needs: [ build-image ]
    outputs:
      image: "${{ steps.get-image.outputs.image }}"
      operator_version: "${{ steps.get-image.outputs.operator_version }}"
    steps:
      - id: get-image
        name: Get image for tests
        shell: bash
        env:
          PR_NUMBER: ${{github.event.number}}
        run: |
          image="${IMAGE_NAME}:PR-${PR_NUMBER}"
          operator_version="PR-${PR_NUMBER}"
          echo "image=${image}"
          echo "image=${image}" >> $GITHUB_OUTPUT
          echo "operator_version=${operator_version}"
          echo "operator_version=${operator_version}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - id: check-image
        name: Check whether image exists
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.get-image.outputs.image }}
        run: |
          image_id=$(docker images -q "${LOCAL_IMAGE}")
          if [ -z "${image_id}" ]; then
            echo "Image does not exist"
            exit 1
          fi

  unit-tests:
    name: Unit tests & lint
    uses: ./.github/workflows/call-unit-lint.yaml
    secrets: inherit

  e2e-tests-k3d:
    name: E2E tests K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      fail-fast: false
      matrix:
        test_make_target: [ "e2e-test-part1", "e2e-test-part2" ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          test_make_target: ${{ matrix.test_make_target }}
          k3d_configuration: 'default'

  old-e2e-tests-k3d:
    name: (old) E2E tests K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          test_make_target: "test-integration-ory"
          k3d_configuration: 'default'

  migration-downtime-tests-k3d:
    name: Zero Downtime Migration Tests K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      fail-fast: false
      matrix:
        handler: [ "no_auth", "allow", "noop", "jwt", "oauth2_introspection" ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HANDLER: ${{ matrix.handler }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          test_make_target: test-migration-zero-downtime-${{ matrix.handler }}
          k3d_configuration: 'default'

  verify-pins:
    name: Verify-commit-pins
    uses: ./.github/workflows/call-verify-commit-pins.yaml
    secrets: inherit

  pull-request-status:
    needs:
      - detect-scope
      - check-docs
      - check-images
      - build-image
      - unit-tests
      - e2e-tests-k3d
      - old-e2e-tests-k3d
      - migration-downtime-tests-k3d
      - verify-pins
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "Some jobs failed"
          exit 1
      - if: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Some jobs were cancelled"
          exit 1
      - run: echo "All jobs passed"
