name: E2E dualstack

# Manual dualstack e2e run against a Gardener AWS dualstack shoot.
# The shoot, the api-gateway operator and Istio all run dualstack (the
# experimental istio-manager, selected from the shoot's GARDENER_IP_STACK).
# The tests dial the workloads over IPv4: GitHub-hosted runners have no IPv6,
# so a v6 dial to the cluster LB is impossible today. This validates that the
# IPv4 path still works underneath a dualstack stack. Flip TEST_IP_FAMILY to
# dualstack once the runners gain IPv6.
# Mirrors the image flow of schedule-main-integration.yaml: it resolves the
# latest promoted 'main' api-gateway image already pushed to the registry, so
# the shoot can pull it directly (no local build to hand across runners).
# PR-only manager changes are not exercised here. Pure-IPv4 shoots are covered
# by the standard PR/daily gates, so this workflow is dualstack-shoot-only and
# dispatch-only: each matrix entry provisions its own shoot, run it when you
# need the signal.

on:
  workflow_dispatch:

concurrency:
  # One in-flight run per ref keeps a re-dispatch from stacking shoots.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: "europe-docker.pkg.dev/kyma-project/prod/api-gateway/main/api-gateway-manager"
  # Test client dial family. Kept at ipv4: the shoot/operator/Istio run
  # dualstack, but GitHub-hosted runners have no IPv6, so tests dial v4.
  # Flip to dualstack when the runners gain IPv6.
  TEST_IP_FAMILY: "ipv4"

jobs:
  get-image:
    name: Get api-gateway image
    runs-on: ubuntu-latest
    outputs:
      image: "${{ steps.get-image.outputs.image }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: get-image
        name: Resolve latest promoted main image
        shell: bash
        run: |
          commit_id=$("${{ github.workspace }}/hack/ci/get-latest-sha.sh" "${{ env.IMAGE_NAME }}")
          image="${{ env.IMAGE_NAME }}:${commit_id}"
          echo "image=${image}"
          echo "image=${image}" >> $GITHUB_OUTPUT
      - name: Check whether image exists
        shell: bash
        run: docker pull "${{ steps.get-image.outputs.image }}"

  api-gateway-e2e-dualstack:
    name: API Gateway E2E test (dualstack) ${{ matrix.test_make_target }}
    environment:
      name: e2e
      deployment: false
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      # Keep sibling suites alive so a single flaky suite doesn't hide the
      # rest of the breakage catalogue on first dualstack contact.
      fail-fast: false
      matrix:
        # Dualstack sublists of tests/e2e/tests: only the suites that
        # exercise HTTP (LB dial or in-cluster). Suites that only assert
        # on CR state / admission webhooks / reconciler behaviour
        # (request, service, validation) are excluded — the family axis
        # is inert for them.
        test_make_target:
          - "dualstack-e2e-test-part1"
          - "dualstack-e2e-test-part2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-test-gardener
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          gardener_secret: ${{ secrets.GARDENER_TOKEN }}
          gardener_project_name: ${{ vars.GARDENER_PROJECT_NAME }}
          gardener_configuration: aws-dualstack
          test_client_id: ${{ secrets.CLIENT_ID }}
          test_client_secret: ${{ secrets.CLIENT_SECRET }}
          test_oidc_well_known_url: "${{ secrets.OIDC_ISSUER_URL }}/.well-known/openid-configuration"
          test_make_target: ${{ matrix.test_make_target }}
          test_ip_family: ${{ env.TEST_IP_FAMILY }}

  # Custom domain dials the ingress LB over HTTPS, so the family axis is
  # live. Runs on the AWS dualstack shoot with GCP-managed DNS
  # (DNS_SECRET_JSON) — the same split the ipv4 aws custom-domain gate uses,
  # so the only new axis here is the v6 dial. Kept off the part1/part2 matrix
  # because it needs the custom-domain inputs the matrix does not carry.
  api-gateway-e2e-dualstack-custom-domain:
    name: API Gateway E2E custom domain test (dualstack)
    environment:
      name: e2e
      deployment: false
    runs-on: ubuntu-latest
    needs: [ get-image ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-test-gardener
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APIGATEWAY_ACCESS_SIG_BASE64: ${{ secrets.GARDENER_APIRULE_ACCESS }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          gardener_secret: ${{ secrets.GARDENER_TOKEN }}
          gardener_project_name: ${{ vars.GARDENER_PROJECT_NAME }}
          gardener_configuration: aws-dualstack
          test_client_id: ${{ vars.CLIENT_ID }}
          test_client_secret: ${{ secrets.CLIENT_SECRET }}
          test_oidc_well_known_url: "${{ vars.OIDC_ISSUER_URL }}/.well-known/openid-configuration"
          dns_secret_json: ${{ secrets.DNS_SECRET_JSON }}
          test_custom_domain: ${{ vars.TEST_CUSTOM_DOMAIN }}
          test_make_target: 'dualstack-e2e-test-custom-domain'
          test_ip_family: ${{ env.TEST_IP_FAMILY }}
