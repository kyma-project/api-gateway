name: E2E dualstack

# Two entry points, both run the tests/e2e Go suites on a dualstack shoot:
#   1. workflow_dispatch — manual kickoff from the Actions UI.
#   2. pull_request labeled 'dualstack' — automatic on labeled PRs.
# IPv4 is already covered by the standard PR gate, so this workflow is
# dualstack-only. Each matrix entry provisions its own shoot; label the PR
# only when you want to pay that cost.
#
# The manager image resolved here is the currently-promoted 'main' image
# from europe-docker.pkg.dev; PR-only manager changes are not exercised by
# this workflow yet. See TODO in build-manager-image if you need that.

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize, reopened ]

concurrency:
  # One in-flight run per ref keeps a re-push from stacking shoots.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: "europe-docker.pkg.dev/kyma-project/prod/api-gateway/main/api-gateway-manager"
  LABEL_NAME: "dualstack"
  # Fixed for this workflow — IPv4 is exercised by the standard PR gate,
  # so there is no reason to run this pipeline in any other mode.
  TEST_IP_FAMILY: "dualstack"

jobs:
  # PR events fire on every synchronize regardless of labels; gate the
  # actual work on the label being present, so unlabeled PRs pay only a
  # cheap no-op job.
  check-label:
    name: Check label
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'dualstack') }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  get-image:
    name: Get api-gateway image
    needs: [ check-label ]
    if: needs.check-label.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: "${{ steps.get-image.outputs.image }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: get-image
        name: Resolve latest promoted main image
        shell: bash
        run: |
          commit_id=$("${{ github.workspace }}/hack/ci/get-latest-sha.sh" "${{ env.IMAGE_NAME }}")
          image="${{ env.IMAGE_NAME }}:${commit_id}"
          echo "image=${image}"
          echo "image=${image}" >> $GITHUB_OUTPUT
      - name: Check whether image exists
        shell: bash
        run: docker pull "${{ steps.get-image.outputs.image }}"

  api-gateway-e2e-dualstack:
    name: API Gateway E2E test (dualstack) ${{ matrix.test_make_target }}
    environment:
      name: e2e
      deployment: false
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      # Keep sibling suites alive so a single flaky suite doesn't hide the
      # rest of the breakage catalogue on first dualstack contact.
      fail-fast: false
      matrix:
        # Dualstack sublists of tests/e2e/tests: only the suites that
        # exercise HTTP (LB dial or in-cluster). Suites that only assert
        # on CR state / admission webhooks / reconciler behaviour
        # (request, service, validation) are excluded — the family axis
        # is inert for them.
        test_make_target:
          - "dualstack-e2e-test-part1"
          - "dualstack-e2e-test-part2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-test-gardener-dualstack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          gardener_secret: ${{ secrets.GARDENER_TOKEN }}
          gardener_project_name: ${{ vars.GARDENER_PROJECT_NAME }}
          test_client_id: ${{ secrets.CLIENT_ID }}
          test_client_secret: ${{ secrets.CLIENT_SECRET }}
          test_oidc_well_known_url: "${{ secrets.OIDC_ISSUER_URL }}/.well-known/openid-configuration"
          test_make_target: ${{ matrix.test_make_target }}
          test_ip_family: ${{ env.TEST_IP_FAMILY }}
