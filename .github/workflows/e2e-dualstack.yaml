name: E2E dualstack

# Manual dualstack e2e run against a Gardener AWS dualstack shoot.
# Mirrors the image flow of schedule-main-integration.yaml: it resolves the
# latest promoted 'main' api-gateway image already pushed to the registry, so
# the shoot can pull it directly (no local build to hand across runners).
# PR-only manager changes are not exercised here. IPv4 is covered by the
# standard PR/daily gates, so this workflow is dualstack-only and dispatch-
# only: each matrix entry provisions its own shoot, run it when you need the
# signal.

on:
  workflow_dispatch:

concurrency:
  # One in-flight run per ref keeps a re-dispatch from stacking shoots.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: "europe-docker.pkg.dev/kyma-project/prod/api-gateway/main/api-gateway-manager"
  # Fixed for this workflow — IPv4 is exercised by the standard PR gate,
  # so there is no reason to run this pipeline in any other mode.
  TEST_IP_FAMILY: "dualstack"

jobs:
  get-image:
    name: Get api-gateway image
    runs-on: ubuntu-latest
    outputs:
      image: "${{ steps.get-image.outputs.image }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: get-image
        name: Resolve latest promoted main image
        shell: bash
        run: |
          commit_id=$("${{ github.workspace }}/hack/ci/get-latest-sha.sh" "${{ env.IMAGE_NAME }}")
          image="${{ env.IMAGE_NAME }}:${commit_id}"
          echo "image=${image}"
          echo "image=${image}" >> $GITHUB_OUTPUT
      - name: Check whether image exists
        shell: bash
        run: docker pull "${{ steps.get-image.outputs.image }}"

  api-gateway-e2e-dualstack:
    name: API Gateway E2E test (dualstack) ${{ matrix.test_make_target }}
    environment:
      name: e2e
      deployment: false
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      # Keep sibling suites alive so a single flaky suite doesn't hide the
      # rest of the breakage catalogue on first dualstack contact.
      fail-fast: false
      matrix:
        # Dualstack sublists of tests/e2e/tests: only the suites that
        # exercise HTTP (LB dial or in-cluster). Suites that only assert
        # on CR state / admission webhooks / reconciler behaviour
        # (request, service, validation) are excluded — the family axis
        # is inert for them.
        test_make_target:
          - "dualstack-e2e-test-part1"
          - "dualstack-e2e-test-part2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-test-gardener-dualstack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          gardener_secret: ${{ secrets.GARDENER_TOKEN }}
          gardener_project_name: ${{ vars.GARDENER_PROJECT_NAME }}
          test_client_id: ${{ secrets.CLIENT_ID }}
          test_client_secret: ${{ secrets.CLIENT_SECRET }}
          test_oidc_well_known_url: "${{ secrets.OIDC_ISSUER_URL }}/.well-known/openid-configuration"
          test_make_target: ${{ matrix.test_make_target }}
          test_ip_family: ${{ env.TEST_IP_FAMILY }}
