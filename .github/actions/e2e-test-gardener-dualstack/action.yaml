name: 'E2E tests (Gardener, dualstack)'
description: 'Provisions a dualstack AWS Gardener shoot and runs an e2e make target with TEST_IP_FAMILY=dualstack'
inputs:
  manager_image:
    description: "Manager image used for test"
    required: true
  gardener_secret:
    description: "Kubeconfig secret for Gardener"
    required: true
  gardener_project_name:
    required: true
    description: "Name of the gardener project"
  test_make_target:
    description: 'Make target for integration tests to run'
    required: true
  test_client_id:
    description: "Client id for oidc"
    required: false
  test_client_secret:
    description: "Client secret for oidc"
    required: false
  test_oidc_well_known_url:
    description: "OIDC well known URL"
    required: false
  test_ip_family:
    description: 'Value passed to TEST_IP_FAMILY (ipv4|ipv6|dualstack)'
    required: false
    default: 'dualstack'

runs:
  using: "composite"
  steps:
    - name: Generate cluster name
      shell: bash
      # 'ds' prefix flags dualstack shoots in the Gardener project list.
      run: echo CLUSTER_NAME=ds-$(echo $RANDOM | md5sum | head -c 7) >> $GITHUB_ENV
    - uses: actions/setup-go@v5
      with:
        go-version-file: "go.mod"
    - name: Prepare gardener kubeconfig
      shell: bash
      env:
        GARDENER_TOKEN: ${{ inputs.gardener_secret }}
      run: "${{ github.workspace }}/hack/ci/gardener_kubeconfig.sh"
    - name: Provision dualstack cluster
      shell: bash
      env:
        GARDENER_KUBECONFIG: "${{ github.workspace }}/gardener_kubeconfig.yaml"
        CLUSTER_KUBECONFIG: "${{ github.workspace }}/${{ env.CLUSTER_NAME }}_kubeconfig.yaml"
        # 'aws-dualstack' selects shoot_aws-dualstack.yaml and
        # set-aws-dualstack-gardener.sh in hack/ci/.
        GARDENER_PROVIDER: aws-dualstack
        GARDENER_PROJECT_NAME: ${{ inputs.gardener_project_name }}
        PIPELINE_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      run: "${{ github.workspace }}/hack/ci/provision-gardener.sh"
    - name: Run integration tests
      shell: bash
      env:
        IMG: ${{ inputs.manager_image }}
        TEST_CLIENT_ID: ${{ inputs.test_client_id }}
        TEST_CLIENT_SECRET: ${{ inputs.test_client_secret }}
        TEST_OIDC_CONFIG_URL: ${{ inputs.test_oidc_well_known_url }}
        CLUSTER_KUBECONFIG: "${{ github.workspace }}/${{ env.CLUSTER_NAME }}_kubeconfig.yaml"
        # Drives ipfamily.From() -> DialNetworks(); assertion helpers use
        # this to fan out one t.Run per family. The make target inherits
        # it via the shell, no Makefile change required.
        TEST_IP_FAMILY: ${{ inputs.test_ip_family }}
      # `make dualstack-e2e-setup` runs hack/ci/install-dualstack-prereqs.sh
      # (dualstack CM + experimental istio-manager), `make deploy`
      # (api-gateway operator, IMG=...), and `kubectl wait` for the LB
      # address. Then this step runs one matrix half of the suites with
      # TEST_IP_FAMILY=dualstack so assert helpers fan out into tcp4/tcp6
      # subtests per family. hack/ci/integration-test-gardener.sh is not
      # used here — its `make install-istio` step creates an Istio CR that
      # collides with tests/e2e/tests/* (409 Conflict), and its curl-based
      # ingress warmup fails from network positions where port 15021 is
      # unreachable (see docs/dualstack/logs for the diagnosis).
      run: |
        set -euo pipefail
        export KUBECONFIG="${CLUSTER_KUBECONFIG}"
        export TEST_DOMAIN=$(kubectl get cm -n kube-system shoot-info -o jsonpath='{.data.domain}')
        export IS_GARDENER=true
        make dualstack-e2e-setup
        make ${{ inputs.test_make_target }}
    - name: Gather deployment logs
      shell: bash
      if: always()
      run: |
        mkdir -p logs
        export KUBECONFIG="${{ github.workspace }}/${{ env.CLUSTER_NAME }}_kubeconfig.yaml"
        (kubectl logs -n kyma-system deployments/istio-controller-manager || true) > logs/istio-controller-manager.log
        (kubectl logs -n kyma-system deployments/api-gateway-controller-manager || true) > logs/api-gateway-controller-manager.log
        (kubectl logs -n istio-system deployments/istio-ingressgateway || true) > logs/istio-ingressgateway.log
        (kubectl logs -n istio-system deployments/istiod || true) > logs/istiod.log
        (kubectl logs -n kyma-system deployments/ory-oathkeeper || true) > logs/ory-oathkeeper.log
        (kubectl get --all-namespaces apirules.gateway.kyma-project.io -oyaml || true) > logs/apirules-dump.yaml
        (kubectl get --all-namespaces apigateways.operator.kyma-project.io -oyaml || true) > logs/gateway-dump.yaml
        (kubectl get -n kyma-system deployment ory-oathkeeper -oyaml || true) > logs/ory-oathkeeper-dump.yaml
        (kubectl api-resources --verbs=list -o name | xargs -n 1 kubectl get -oyaml --ignore-not-found || true) > logs/resources-dump.yaml
    - name: Gather Gardener logs
      shell: bash
      if: always()
      env:
        GARDENER_KUBECONFIG: "${{ github.workspace }}/gardener_kubeconfig.yaml"
      run: |
        (kubectl --kubeconfig "${GARDENER_KUBECONFIG}" get shoot "${{ env.CLUSTER_NAME }}" -o yaml || true) > logs/shoot.yaml
    - name: Uploads logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: logs-${{ github.job }}-${{ inputs.test_make_target }}-dualstack
        path: logs/
    - name: Uploads artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-reports_${{ github.job }}_${{ github.run_id }}_${{ inputs.test_make_target }}_dualstack
        path: tests/integration/reports/
    - name: Deprovision cluster
      if: success() || cancelled()
      shell: bash
      env:
        GARDENER_KUBECONFIG: "${{ github.workspace }}/gardener_kubeconfig.yaml"
        GARDENER_PROJECT_NAME: ${{ inputs.gardener_project_name }}
      run: "${{ github.workspace }}/hack/ci/deprovision-gardener.sh"
