apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: ${CLUSTER_NAME}
  annotations:
    kyma-project.io/pipeline-link: "${PIPELINE_LINK}"
  labels:
    kyma-project.io/created-by-tests-of-module: "api-gateway"
    kyma-project.io/ip-families: "dualstack"
spec:
  credentialsBindingName: ${GARDENER_PROVIDER_SECRET_NAME}
  cloudProfile:
    kind: CloudProfile
    name: aws
  region: ${GARDENER_REGION}
  purpose: evaluation
  controlPlane:
    highAvailability:
      failureTolerance:
        type: zone
  provider:
    type: aws
    controlPlaneConfig:
      apiVersion: aws.provider.extensions.gardener.cloud/v1alpha1
      kind: ControlPlaneConfig
      # AWS Load Balancer Controller is required to translate the
      # dualstack Service annotation into an NLB that advertises A + AAAA.
      loadBalancerController:
        enabled: true
    infrastructureConfig:
      apiVersion: aws.provider.extensions.gardener.cloud/v1alpha1
      kind: InfrastructureConfig
      # Assigns an IPv6 CIDR to the VPC and IPv6 subnets, without which
      # nodes and Services cannot obtain v6 addresses.
      dualStack:
        enabled: true
      networks:
        vpc:
          cidr: 10.250.0.0/16
        zones:
          - name: ${GARDENER_REGION}a
            internal: 10.250.48.0/20
            public: 10.250.32.0/20
            workers: 10.250.0.0/19
          - name: ${GARDENER_REGION}b
            internal: 10.250.112.0/20
            public: 10.250.96.0/20
            workers: 10.250.64.0/19
          - name: ${GARDENER_REGION}c
            internal: 10.250.176.0/20
            public: 10.250.160.0/20
            workers: 10.250.128.0/19
    workers:
      - name: cpu-worker
        minimum: ${SCALER_MIN}
        maximum: ${SCALER_MAX}
        machine:
          type: ${MACHINE_TYPE}
        volume:
          type: ${DISK_TYPE}
          size: ${DISK_SIZE}Gi
        zones:
          - ${GARDENER_REGION}a
          - ${GARDENER_REGION}b
          - ${GARDENER_REGION}c
  networking:
    type: calico
    # ipFamilies drives kube-controller-manager, kube-proxy and CNI to
    # allocate v4+v6 to pods and services; ordering makes v4 primary.
    ipFamilies:
      - IPv4
      - IPv6
    pods: 100.96.0.0/11
    nodes: 10.250.0.0/16
    services: 100.64.0.0/13
  kubernetes:
    version: ${GARDENER_CLUSTER_VERSION}
  hibernation:
    enabled: false
  extensions:
    - type: shoot-dns-service
      providerConfig:
        apiVersion: service.dns.extensions.gardener.cloud/v1alpha1
        dnsProviderReplication:
          enabled: true
        kind: DNSConfig
        syncProvidersFromShootSpecDNS: true
    - type: shoot-cert-service
      providerConfig:
        apiVersion: service.cert.extensions.gardener.cloud/v1alpha1
        kind: CertConfig
        shootIssuers:
          enabled: true
